name: 每日扫源
on:
  schedule:
    # 北京 03:00（UTC 19:00 前一天）
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-sources
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 探接口扫源
        shell: pwsh
        run: |
          ./scripts/cloud/scan_sources.ps1 -Throttle 6

      - name: 提交产物
        run: |
          git config user.name "live-scan-bot"
          git config user.email "live-scan-bot@users.noreply.github.com"
          git add out/candidates.json out/pending.m3u || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
